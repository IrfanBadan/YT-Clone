<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Clone</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="./images/youtube-svgrepo-com.svg" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-black">

  <!-- ======= Navbar ======= -->
  <nav class="navbar navbar-expand-lg py-3 pb-0 fixed-top">
    <div class="navMain">

      <!-- ===== Left Section ===== -->
      <div class="navFirstDiv">
        <div class="burger-menu"><i class="bi bi-list"></i></div>

        <div class="brand-Name">
          <div class="logo-image">
            <img src="./images/youtube-svgrepo-com.svg" class="logo" alt="YouTube Logo">
          </div>
          <a class="navbar-brand text-light fw-bolder fs-5" href="#">YouTube</a>
          <p class="brand-in">IN</p>
        </div>
      </div>

      <!-- ===== Center Section ===== -->
      <div class="navSecondDiv">
        <form class="d-flex nav-form input-group" role="search">
          <input class="form-control searchInput" type="search" placeholder="Search" aria-label="Search">
          <button class="btn btn-outline-success searchBtn" type="submit"><i class="bi bi-search"></i></button>
        </form>
        <a href="#"><i class="bi bi-mic-fill fs-5 micBtn"></i></a>
      </div>

      <!-- ===== Right Section ===== -->
      <div class="navThirdDiv">
        <button class="ThirdDivBtn text-light"><i class="bi bi-plus-lg"></i> Create</button>
        <i class="bi bi-bell fs-3 text-light"></i>
        <div class="profile">
          <button class="btn p-0 mb-3" data-bs-toggle="modal" data-bs-target="#loginModal">
            <i class="bi bi-person-circle fs-2 loginBtn"></i>
          </button>
        </div>
      </div>

    </div>
  </nav>

  <!-- ===== Sidebar ===== -->
  <div id="sidebar" class="sidebar">
    <h3 class="menu-title">Menu</h3>
    <hr>
    <div class="sidebar-section">
      <a href="#" class="active"><i class="bi bi-house-door-fill"></i> Home</a>
      <a href="#"><i class="bi bi-lightning-fill"></i> Shorts</a>
      <a href="#"><i class="bi bi-collection-play"></i> Subscriptions <span class="dot"></span></a>
    </div>

    <hr class="sidebar-divider">

    <div class="sidebar-section">
      <div class="sidebar-heading fs-5">You <i class="bi bi-chevron-right"></i></div>
      <a href="#"><i class="bi bi-clock-history"></i> History</a>
      <a href="#"><i class="bi bi-list-task"></i> Playlists</a>
      <a href="#"><i class="bi bi-camera-video"></i> Your videos</a>
      <a href="#"><i class="bi bi-clock"></i> Watch Later</a>
      <a href="#"><i class="bi bi-hand-thumbs-up"></i> Liked videos</a>
    </div>

    <hr class="sidebar-divider">

    <div class="sidebar-section">
      <div class="sidebar-heading fs-5">Explore <i class="bi bi-chevron-right"></i></div>
      <a href="#"><i class="bi bi-cart-check"></i> Shopping</a>
      <a href="#"><i class="bi bi-music-note-beamed"></i> Music</a>
      <a href="#"><i class="bi bi-film"></i> Films</a>
      <a href="#"><i class="bi bi-controller"></i> Gaming</a>
      <a href="#"><i class="bi bi-newspaper"></i> News</a>
    </div>
  </div>

  <!-- ===== Main Content ===== -->
  <div class="d-flex">
    <section style="margin-top: 5.2em; margin-left: 5em; width: 95%;">
      <!-- Filter Buttons -->
      <div class="buttons ps-3 pb-2 w-100 lead btns">
        <button class="btn btn-light fw-bold fs-6 me-1">All</button>
        <button class="btn btn-dark fw-bold fs-6 me-1">Music</button>
        <button class="btn btn-dark fw-bold fs-6 me-1">Mixes</button>
        <button class="btn btn-dark fw-bold fs-6 me-1">Recently Updated</button>
        <button class="btn btn-dark fw-bold fs-6 me-1">Movies</button>
        <button class="btn btn-dark fw-bold fs-6 me-1">Life style</button>
        <button class="btn btn-dark fw-bold fs-6 me-1">Naruto</button>
        <button class="btn btn-dark fw-bold fs-6 me-1">Live</button>
        <button class="btn btn-dark fw-bold fs-6 me-1">AR Rahman Songs</button>
        <button class="btn btn-dark fw-bold fs-6 me-1">Comedy</button>
        <button class="btn btn-dark fw-bold fs-6 me-1">Pop Music</button>
        <button class="btn btn-dark fw-bold fs-6 me-1">News</button>
      </div>

   <!-- ===== Video Grid ===== -->
<section class="video-section" style="margin-top: 5.2em; margin-left: 5em; width: 95%;">
  <!-- Filter Buttons (keep as is) -->
  <div class="buttons ps-3 pb-2 w-100 lead btns">
    <button class="btn btn-light fw-bold fs-6 me-1">All</button>
    <button class="btn btn-dark fw-bold fs-6 me-1">Music</button>
    <button class="btn btn-dark fw-bold fs-6 me-1">Mixes</button>
    <button class="btn btn-dark fw-bold fs-6 me-1">Recently Updated</button>
    <!-- Add other filter buttons -->
  </div>

  <!-- Responsive Video Grid -->
  <div class="video-grid">
    <iframe src="https://www.youtube.com/embed/qeVfT2iLiu0" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/eGtDHht4VnU" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/1JJWmntMF2o" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/EPN3YghHPe0" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/e61ahdBvIk4" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/2qCpY38ompo" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/ZBY2-g27oTQ" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/j_ihB_TdVrM" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/7fUljO-O_-A" allowfullscreen></iframe>
    <!-- Add more videos as needed -->
  </div>
</section>


  <!-- ===== Login Modal ===== -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content" 
           style="background-image: url(./images/abstract-geometric-computer-wallpaper-white-border-connecting-dots-digital-technology-vector-design.jpg); background-size: cover;">
        <div class="modal-header border-0">
          <button type="button" class="btn-close bg-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" style="width: 70%; margin: 2.5em auto; backdrop-filter: blur(2px); border-radius: 20px; border: 2px solid white;">
          <form id="loginForm" action="index2.html">
            <h2 class="text-center mb-3 text-white">
              <img style="width: 50px; margin-bottom: 1.5em;" src="./images/youtube-svgrepo-com.svg"> YouTube
            </h2>
            <input class="form-control mb-4" type="email" placeholder="Enter your email" required>
            <input class="form-control mb-5" type="password" placeholder="Password" required>
            <button type="submit" class="btn w-100 mb-3" style="background-color: red; color: white; border-radius: 10px;">Login</button>
            <div class="d-flex justify-content-between text-white">
              <a href="#">Forget password?</a>
              <a href="#">Sign In</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
